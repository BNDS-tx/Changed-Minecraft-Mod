# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Avoid configure-on-demand / parallel configure; IntelliJ sync can resolve :runtimeClasspathCopy before userdev is ready.
org.gradle.configureondemand=false
org.gradle.parallel=false
# IntelliJ: Gradle sync uses Settings > Build Tools > Gradle > Gradle JVM, NOT the terminal JAVA_HOME. Set that JVM to JDK 17.
# If only sync fails: open Build tool window and compare [Changed] Gradle user home with terminal; or run: gradlew --stop compileJava then sync.

# Which JDK version to use when compiling, 1.18.2 uses Java 17
javaVersion = 17

modVersion = v0.15.4.t
minecraftVersion = 1.18.2
# 40.2.x userdev findRecomp can fail on some JDK 17 builds (e.g. Microsoft 17.0.17); 40.3.x recommended line for 1.18.2.
forgeVersion = 40.3.0
jeiVersion = 9.7.0.192
reiVersion = 8.3.649
clothVersion = 6.5.102
archVersion = 4.11.93